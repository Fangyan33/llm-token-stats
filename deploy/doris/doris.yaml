# Single-node development fixture. Use Doris Operator and multiple FE/BE nodes in production.
apiVersion: v1
kind: Service
metadata:
  name: llm-token-stats-doris
spec:
  clusterIP: None
  selector:
    app: llm-token-stats-doris
  ports:
    - name: mysql
      port: 9030
      targetPort: mysql
    - name: fe-http
      port: 8030
      targetPort: fe-http
    - name: be-http
      port: 8040
      targetPort: be-http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llm-token-stats-doris
spec:
  serviceName: llm-token-stats-doris
  replicas: 1
  selector:
    matchLabels:
      app: llm-token-stats-doris
  template:
    metadata:
      labels:
        app: llm-token-stats-doris
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: doris
          image: apache/doris:all-in-one-4.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 9030
            - name: fe-http
              containerPort: 8030
            - name: be-http
              containerPort: 8040
          startupProbe:
            httpGet:
              path: /api/health
              port: fe-http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: fe-http
            periodSeconds: 5
          volumeMounts:
            - name: llm-token-stats-fe-meta
              mountPath: /opt/apache-doris/fe/doris-meta
            - name: llm-token-stats-be-storage
              mountPath: /opt/apache-doris/be/storage
  volumeClaimTemplates:
    - metadata:
        name: llm-token-stats-fe-meta
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: llm-token-stats-be-storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
