# 模板需经 render_gateway_filter.py 渲染；默认关闭时直接使用 Lua 透传。
# 鉴权必须位于本过滤器之前；验证已激活监听器中的顺序。
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: REPLACE_ENVOYFILTER_NAME
  namespace: REPLACE_GATEWAY_NAMESPACE
spec:
  workloadSelector:
    labels:
REPLACE_GATEWAY_LABELS
  configPatches:
    - applyTo: EXTENSION_CONFIG
      match:
        context: GATEWAY
        proxy:
          metadata:
            NAMESPACE: REPLACE_GATEWAY_NAMESPACE
          proxyVersion: '^1\.(1[4-9]|[2-9][0-9])\.'
      patch:
        operation: ADD
        value:
          name: REPLACE_ECDS_NAME
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
            config:
              name: gateway-observer
              root_id: gateway-observer
              fail_open: true
              vm_config:
                vm_id: gateway-observer-v1
                runtime: envoy.wasm.runtime.v8
                environment_variables:
                  host_env_keys: [LOG_LEVEL]
                # 缓存缺失时拒绝本次配置并后台下载，不向请求暴露未下载完成的 VM。
                nack_on_code_cache_miss: true
                code:
                  remote:
                    http_uri:
                      uri: REPLACE_WASM_URL
                      cluster: REPLACE_WASM_CLUSTER
                      timeout: 5s
                    sha256: REPLACE_WASM_SHA256
                    retry_policy:
                      num_retries: 0
              configuration:
                '@type': type.googleapis.com/google.protobuf.Struct
                value:
REPLACE_PLUGIN_YAML
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        proxy:
          metadata:
            NAMESPACE: REPLACE_GATEWAY_NAMESPACE
          proxyVersion: '^1\.(1[4-9]|[2-9][0-9])\.'
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: REPLACE_ECDS_NAME
          config_discovery:
            config_source:
              ads: {}
              resource_api_version: V3
            # 首次无有效扩展时直接透传；后续更新被拒绝则保留上一份有效配置。
            apply_default_config_without_warming: true
            default_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              inline_code: |
                function envoy_on_request(handle)
                end
            type_urls:
              - type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
              - type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
