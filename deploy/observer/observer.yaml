# Render image/config/secret values before use. Kafka config references mounted CA.
apiVersion: apps/v1
kind: Deployment
metadata: {name: llm-token-stats-observer, namespace: metering}
spec:
  replicas: 2
  selector: {matchLabels: {app: llm-token-stats-observer}}
  template:
    metadata: {labels: {app: llm-token-stats-observer}}
    spec:
      containers:
        - name: observer
          image: REPLACE_OBSERVER_IMAGE_DIGEST
          args: [--config, /config/observer.json]
          ports: [{name: grpc, containerPort: 9090}, {name: health, containerPort: 9091}, {name: http-wasm, containerPort: 9093}]
          envFrom:
            - secretRef: {name: llm-token-stats-observer-lookups, optional: true}
          env:
            - name: LOG_LEVEL
              value: info
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: KAFKA_USERNAME
              valueFrom: {secretKeyRef: {name: llm-token-stats-kafka-sasl, key: username}}
            - name: KAFKA_PASSWORD
              valueFrom: {secretKeyRef: {name: llm-token-stats-kafka-sasl, key: password}}
          # 配合 10 GiB 解析预算预留运行时、Producer 及连接内存；按实测调整。
          resources: {requests: {cpu: '2', memory: 2Gi}, limits: {cpu: '8', memory: 12Gi}}
          readinessProbe: {httpGet: {path: /readyz, port: health}}
          livenessProbe: {httpGet: {path: /livez, port: health}}
          volumeMounts: [{name: config, mountPath: /config, readOnly: true}, {name: kafka-tls, mountPath: /secrets/kafka, readOnly: true}]
      volumes:
        - name: config
          configMap: {name: llm-token-stats-observer}
        - name: kafka-tls
          secret: {secretName: llm-token-stats-kafka-tls}
---
apiVersion: v1
kind: Service
metadata: {name: llm-token-stats-observer, namespace: metering}
spec:
  selector: {app: llm-token-stats-observer}
  ports: [{name: grpc, port: 9090, targetPort: grpc}, {name: health, port: 9091, targetPort: health}, {name: http-wasm, port: 9093, targetPort: http-wasm}]
